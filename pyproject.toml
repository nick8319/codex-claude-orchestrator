[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"] # Tests import standalone CLI modules from scripts/.

[tool.mypy]
python_version = "3.11"
files = ["scripts"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

